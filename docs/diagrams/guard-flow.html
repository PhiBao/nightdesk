<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NightDesk — Guard flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0b0e14;
      --color-ink:     #e8ecf1;
      --color-muted:   #8b93a3;
      --color-accent:  #34d399;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Guard flow · NightDesk</p>
    <h1>One intent, one batched judgment</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guard-flow-title guard-flow-desc">
        <title id="guard-flow-title">NightDesk guard sequence</title>
        <desc id="guard-flow-desc">A plain-English buy intent flows from the user through the app to the truth route and the guard, which asks TypeSafe Jev one batched call and returns a routed action.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8b93a3"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34d399"/></marker>
        </defs>

        <rect width="960" height="640" fill="#0b0e14"/>

        <!-- ── diagram title ───────────────────────────────────── -->
        <text x="40" y="44" fill="#5c6577" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">NIGHTDESK · GUARD FLOW</text>
        <text x="40" y="72" fill="#e8ecf1" font-size="22" font-family="'Instrument Serif', serif">One intent, one batched judgment</text>

        <g transform="translate(0, 40)">

        <!-- ── lifelines (drawn before actors) ─────────────────── -->
        <line x1="130" y1="168" x2="130" y2="520" stroke="rgba(232,236,241,0.16)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="320" y1="168" x2="320" y2="520" stroke="rgba(232,236,241,0.16)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="510" y1="168" x2="510" y2="520" stroke="rgba(232,236,241,0.16)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="690" y1="168" x2="690" y2="520" stroke="rgba(232,236,241,0.16)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="860" y1="168" x2="860" y2="520" stroke="rgba(232,236,241,0.16)" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- ── activation bars ─────────────────────────────────── -->
        <rect x="316" y="216" width="8" height="252" rx="2" fill="rgba(232,236,241,0.10)" stroke="rgba(232,236,241,0.30)" stroke-width="0.8"/>
        <rect x="506" y="254" width="8" height="38" rx="2" fill="rgba(232,236,241,0.10)" stroke="rgba(232,236,241,0.30)" stroke-width="0.8"/>
        <rect x="686" y="330" width="8" height="106" rx="2" fill="rgba(232,236,241,0.10)" stroke="rgba(232,236,241,0.30)" stroke-width="0.8"/>
        <rect x="856" y="368" width="8" height="38" rx="2" fill="rgba(232,236,241,0.10)" stroke="rgba(232,236,241,0.30)" stroke-width="0.8"/>

        <!-- ── messages (before actor boxes) ───────────────────── -->

        <!-- m1: user → app -->
        <path d="M 130,216 H 312" fill="none" stroke="#8b93a3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="152" y="200" width="134" height="12" rx="3" fill="#0b0e14"/>
        <text x="219" y="209" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">INTENT: BUY NVDA</text>

        <!-- m2: app → truth -->
        <path d="M 320,254 H 502" fill="none" stroke="#8b93a3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="352" y="238" width="114" height="12" rx="3" fill="#0b0e14"/>
        <text x="409" y="247" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">GET /api/truth</text>

        <!-- m3: truth → app (return) -->
        <path d="M 510,292 H 332" fill="none" stroke="#8b93a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="352" y="276" width="134" height="12" rx="3" fill="#0b0e14"/>
        <text x="419" y="285" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">3 VENUES · SPREADS</text>

        <!-- m4: app → guard -->
        <path d="M 320,330 H 682" fill="none" stroke="#8b93a3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="450" y="314" width="116" height="12" rx="3" fill="#0b0e14"/>
        <text x="508" y="323" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">POST /api/guard</text>

        <!-- m5: guard → Jev -->
        <path d="M 690,368 H 852" fill="none" stroke="#8b93a3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="706" y="352" width="128" height="12" rx="3" fill="#0b0e14"/>
        <text x="770" y="361" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">1 CALL · 4 QUESTIONS</text>

        <!-- m6: Jev → guard (headline, accent) -->
        <path d="M 860,406 H 704" fill="none" stroke="#34d399" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="722" y="390" width="124" height="12" rx="3" fill="#0b0e14"/>
        <text x="784" y="399" fill="#34d399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">LIMIT_AT_REFERENCE</text>

        <!-- m7: guard → app (return) -->
        <path d="M 686,444 H 332" fill="none" stroke="#8b93a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="446" y="428" width="126" height="12" rx="3" fill="#0b0e14"/>
        <text x="509" y="437" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ACTION · BLOCK FLAGS</text>

        <!-- m8: app → user (return) -->
        <path d="M 316,482 H 142" fill="none" stroke="#8b93a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="160" y="466" width="132" height="12" rx="3" fill="#0b0e14"/>
        <text x="226" y="475" fill="#8b93a3" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">ARM LIMIT · ALERT</text>

        <!-- ── actor boxes (on top) ────────────────────────────── -->
        <rect x="60" y="108" width="140" height="60" rx="6" fill="#0b0e14"/>
        <rect x="60" y="108" width="140" height="60" rx="6" fill="rgba(139,147,163,0.10)" stroke="#8b93a3" stroke-width="1"/>
        <text x="130" y="134" fill="#e8ecf1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
        <text x="130" y="150" fill="#8b93a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intent</text>

        <rect x="250" y="108" width="140" height="60" rx="6" fill="#0b0e14"/>
        <rect x="250" y="108" width="140" height="60" rx="6" fill="rgba(52,211,153,0.08)" stroke="#34d399" stroke-width="1.2"/>
        <text x="320" y="134" fill="#e8ecf1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next.js App</text>
        <text x="320" y="150" fill="#8b93a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orchestrates</text>

        <rect x="440" y="108" width="140" height="60" rx="6" fill="#0b0e14"/>
        <rect x="440" y="108" width="140" height="60" rx="6" fill="#11161f" stroke="rgba(232,236,241,0.30)" stroke-width="1"/>
        <text x="510" y="134" fill="#e8ecf1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/api/truth</text>
        <text x="510" y="150" fill="#8b93a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live venues</text>

        <rect x="620" y="108" width="140" height="60" rx="6" fill="#0b0e14"/>
        <rect x="620" y="108" width="140" height="60" rx="6" fill="#11161f" stroke="rgba(232,236,241,0.30)" stroke-width="1"/>
        <text x="690" y="134" fill="#e8ecf1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/api/guard</text>
        <text x="690" y="150" fill="#8b93a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routes intent</text>

        <rect x="800" y="108" width="120" height="60" rx="6" fill="#0b0e14"/>
        <rect x="800" y="108" width="120" height="60" rx="6" fill="rgba(232,236,241,0.03)" stroke="rgba(232,236,241,0.28)" stroke-width="1"/>
        <text x="860" y="134" fill="#e8ecf1" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jev</text>
        <text x="860" y="150" fill="#8b93a3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one batch</text>

        <!-- ── legend ──────────────────────────────────────────── -->
        <line x1="40" y1="546" x2="920" y2="546" stroke="rgba(232,236,241,0.10)" stroke-width="0.8"/>
        <text x="40" y="566" fill="#5c6577" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="130" y1="562" x2="158" y2="562" stroke="#8b93a3" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="166" y="566" fill="#8b93a3" font-size="8.5" font-family="'Geist', sans-serif">Request</text>
        <line x1="260" y1="562" x2="288" y2="562" stroke="#8b93a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="296" y="566" fill="#8b93a3" font-size="8.5" font-family="'Geist', sans-serif">Response</text>
        <line x1="410" y1="562" x2="438" y2="562" stroke="#34d399" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="446" y="566" fill="#8b93a3" font-size="8.5" font-family="'Geist', sans-serif">Headline verdict</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
